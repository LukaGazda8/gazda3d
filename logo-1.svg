<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b2b"/>
      <stop offset="100%" style="stop-color:#ffb347"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="#1a1a1a"/>

  <!-- Top rail (centered) -->
  <rect x="30" y="40" width="140" height="12" rx="4" fill="url(#g)"/>

  <!-- Printer body (centered) -->
  <rect x="35" y="52" width="130" height="70" rx="5" fill="none" stroke="url(#g)" stroke-width="3"/>

  <!-- Print head (centered) -->
  <rect x="82" y="44" width="36" height="18" rx="4" fill="#ff6b2b"/>

  <!-- Nozzle -->
  <rect x="93" y="62" width="14" height="12" rx="3" fill="#ffb347"/>

  <!-- Filament dot -->
  <circle cx="100" cy="80" r="4" fill="#ffb347" opacity="0.9"/>

  <!-- Print bed (centered) -->
  <rect x="40" y="118" width="120" height="8" rx="3" fill="#2e2e2e" stroke="#555" stroke-width="1.5"/>

  <!-- Legs (symmetric) -->
  <rect x="45" y="126" width="12" height="10" rx="2" fill="#2e2e2e" stroke="#555" stroke-width="1.5"/>
  <rect x="143" y="126" width="12" height="10" rx="2" fill="#2e2e2e" stroke="#555" stroke-width="1.5"/>

  <!-- Filament spool left -->
  <circle cx="52" cy="58" r="10" fill="none" stroke="#ff6b2b" stroke-width="2"/>
  <circle cx="52" cy="58" r="4" fill="#ff6b2b" opacity="0.4"/>

  <!-- Filament spool right (symmetric) -->
  <circle cx="148" cy="58" r="10" fill="none" stroke="#ff6b2b" stroke-width="2"/>
  <circle cx="148" cy="58" r="4" fill="#ff6b2b" opacity="0.4"/>

  <!-- GAZDA3D text (centered) -->
  <text x="100" y="162" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="26" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#f0ede8">GAZDA</tspan><tspan fill="url(#g)">3D</tspan>
  </text>

  <!-- Tagline (centered) -->
  <text x="100" y="182" font-family="'Courier New', monospace" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="4" fill="url(#g)">TLAČ NA MIERU</text>

  <!-- Accent line (centered) -->
  <rect x="40" y="168" width="120" height="2" rx="1" fill="url(#g)" opacity="0.4"/>
</svg>
