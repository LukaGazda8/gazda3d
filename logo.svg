<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b2b"/>
      <stop offset="100%" style="stop-color:#ffb347"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="100" rx="12" fill="#1a1a1a"/>

  <!-- 3D Printer icon -->
  <rect x="14" y="38" width="52" height="32" rx="4" fill="none" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <rect x="10" y="28" width="60" height="10" rx="3" fill="url(#accentGrad)"/>
  <rect x="30" y="33" width="14" height="8" rx="2" fill="#ff6b2b"/>
  <rect x="36" y="41" width="3" height="6" rx="1" fill="#ffb347"/>
  <circle cx="37.5" cy="49" r="2" fill="#ffb347" opacity="0.8"/>
  <rect x="18" y="62" width="44" height="4" rx="2" fill="#2e2e2e" stroke="#444" stroke-width="1"/>
  <rect x="18" y="66" width="5" height="6" rx="1" fill="#2e2e2e" stroke="#444" stroke-width="1"/>
  <rect x="57" y="66" width="5" height="6" rx="1" fill="#2e2e2e" stroke="#444" stroke-width="1"/>
  <circle cx="57" cy="36" r="7" fill="none" stroke="#ff6b2b" stroke-width="2"/>
  <circle cx="57" cy="36" r="3" fill="#ff6b2b" opacity="0.4"/>

  <!-- GAZDA3D text -->
  <text x="90" y="58" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="32" letter-spacing="-1">
    <tspan fill="#f0ede8">GAZDA</tspan><tspan fill="url(#accentGrad)">3D</tspan>
  </text>
  <!-- tagline -->
  <text x="91" y="78" font-family="'Courier New', monospace" font-weight="700" font-size="12" letter-spacing="5" fill="url(#accentGrad)">TLAČ NA MIERU</text>

  <!-- Accent line -->
  <rect x="90" y="62" width="210" height="2" rx="1" fill="url(#accentGrad)" opacity="0.4"/>
</svg>
